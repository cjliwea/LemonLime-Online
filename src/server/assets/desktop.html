<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线提交系统</title>
<link rel="stylesheet" href="/assets/css/desktop.css">
</head>
<body>
<header id="topbar">
  <div class="tb-left">
    <span class="tb-logo">&#9672;</span>
    <span class="tb-title">在线提交系统</span>
    <span id="tbClock" class="tb-clock" title="比赛剩余时间"></span>
  </div>
  <div class="tb-right">
    <span id="tbNoticeBtn" class="tb-btn" title="公告与开考须知">考试须知<span id="tbNoticeDot" class="tb-dot" hidden></span></span>
    <span id="tbMsgsBtn" class="tb-btn" title="老师私信">消息<span id="tbMsgDot" class="tb-dot" hidden></span></span>
    <span id="tbStatement" class="tb-btn" title="下载题面及样例">题面下载</span>
    <span id="tbUser" class="tb-user">欢迎，…</span>
    <span id="tbLogout" class="tb-btn tb-logout" title="退出登录">退出登录</span>
  </div>
</header>

<div id="shell">
  <!-- 左侧 dock（Ubuntu 风）：应用网格 / 文件 / 回收站 + 运行中窗口 -->
  <nav id="dock">
    <div class="dock-icon plain" id="dkApps" title="应用">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#e8e6f2" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </div>
    <div class="dock-icon plain" id="dkFiles" title="我的文件">
      <svg viewBox="0 0 24 24" width="26" height="26">
        <path fill="#f8c33c" d="M3 6.2C3 5.5 3.5 5 4.2 5h4.6l2 2.4h8.9c.7 0 1.3.5 1.3 1.2v9.2c0 .7-.6 1.2-1.3 1.2H4.2c-.7 0-1.2-.5-1.2-1.2Z"/>
      </svg>
    </div>
    <div id="dockWins"></div>
    <div class="dock-icon plain dock-trash" id="dkTrash" title="回收站">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#e8e6f2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.8 12.2c0 .7.6 1.3 1.3 1.3h6.8c.7 0 1.3-.6 1.3-1.3L17.5 7M10 11v6M14 11v6"/>
      </svg>
    </div>
  </nav>

  <main id="desktop">
    <div id="icons"></div>
    <!-- 左下角「提交代码」面板（HUD） -->
    <aside id="hud">
      <div class="hud-bar" id="hudBar" title="点击折叠/展开">
        <span class="hud-title">提交代码</span>
        <span class="hud-count" id="hudCount">0/0</span>
        <span class="hud-fold" id="hudFold">&#9662;</span>
      </div>
      <div class="hud-list" id="hudList"></div>
    </aside>
    <!-- 右下角同步状态 -->
    <div id="syncBadge"><span class="sync-dot" id="syncDot"></span><span id="syncText">未同步</span></div>
  </main>
</div>

<!-- 须知/公告窗口（静态，内容由 JS 刷新，可真正关闭） -->
<div id="win-notice" class="win" hidden>
  <div class="win-titlebar">
    <span class="win-title">考试须知</span>
    <span class="win-btns">
      <span class="win-btn" data-act="max">&#9744;</span>
      <span class="win-btn" data-act="min">&#8211;</span>
      <span class="win-btn win-close" data-act="close">&#10005;</span>
    </span>
  </div>
  <div class="win-body">
    <h3 class="nb-sec">公告</h3>
    <div id="nbAnnouncement" class="nb-text">暂无公告。</div>
    <h3 class="nb-sec">开考须知</h3>
    <div id="nbNotice" class="nb-text">暂无须知。</div>
  </div>
</div>

<div id="toastHost"></div>
<script src="/assets/js/desktop.js"></script>
</body>
</html>
