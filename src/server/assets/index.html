<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>题目列表 · LemonLime 在线提交</title>
<link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><i class="brand-dot"></i>LemonLime 在线提交</a>
      <div class="topbar-right">
        <a id="statementLink" class="btn btn-ghost" href="/statement" target="_blank" rel="noopener" hidden>题面下载</a>
        <span class="user-chip">
          欢迎，<b id="user">…</b>
        </span>
        <form method="post" action="/logout" class="inline">
          <button class="btn btn-link" type="submit">退出</button>
        </form>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-card">
      <div class="hero-info">
        <h1 id="contestTitle" class="contest-title">…</h1>
        <p class="hero-sub" id="contestMeta"></p>
      </div>
      <div class="hero-timer" id="heroTimer" hidden>
        <div class="hero-time" id="countdown">…</div>
        <div class="hero-bar"><i id="countdownBar"></i></div>
      </div>
    </section>

    <div id="announceBar" class="announce-bar" hidden></div>

    <section class="tcards" id="taskBody" aria-label="题目列表">
      <p class="muted">加载中…</p>
    </section>

    <section class="card upload-card">
      <div class="upload-head">
        <h2 class="upload-title">整包上传选手文件夹</h2>
        <p class="upload-sub muted small">选择以准考证号命名的文件夹。</p>
      </div>

      <div class="upload-row">
        <input type="file" id="folderInput" class="hidden-input" webkitdirectory multiple />
        <button class="btn btn-ghost" id="pickFolderBtn" type="button">选择文件夹…</button>
        <span class="upload-picked muted small" id="pickedHint">尚未选择文件夹</span>
        <span class="upload-picked-error" id="pickedError" hidden></span>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="uploadBtn" type="button" disabled>上传</button>
      </div>

      <div class="upload-result" id="uploadResult" hidden></div>
    </section>
  </main>

  <script src="/assets/js/app.js"></script>
  <script>renderIndex();</script>
</body>
</html>
